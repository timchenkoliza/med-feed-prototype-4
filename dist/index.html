 Главное изменение — более жёсткий целевой диапазон систолического давления и обязательное внеофисное подтверждение диагноза.",blocks:[{t:"p",v:"Целевое систолическое АД для пациентов 18–79 лет — 120–129 мм рт. ст. при условии, что снижение переносится без ортостатических реакций, падений и ухудшения функции почек. Прежняя формулировка допускала верхнюю границу 139 мм рт. ст., что на практике означало остановку титрации на первом приемлемом результате."},{t:"h",v:"Что изменилось в диагностике"},{t:"p",v:"До назначения медикаментозной терапии диагноз подтверждается суточным мониторированием или дневником домашних измерений — не менее семи дней по два измерения утром и вечером. Офисное измерение остаётся точкой входа, но самостоятельным основанием для старта терапии больше не считается."},{t:"ul",v:["Пациенты 80+: целевой диапазон 130–139 мм рт. ст., приоритет — переносимость","ХБП С3б–С4: контроль креатинина и калия через 2–4 недели после каждой титрации","Ортостатическая гипотензия в анамнезе: измерение стоя на каждом визите"]},{t:"h",v:"Что это меняет в практике"},{t:"p",v:"Плановый визит стабильного пациента перестаёт быть формальностью: у части пациентов, которые считались компенсированными, давление теперь выше целевого. Практический шаг — пересмотреть терапию у тех, кто держится в диапазоне 130–139, и оценить, есть ли резерв для титрации."},{t:"quote",v:"Интенсивный контроль давления оправдан там, где он переносится. Формальное достижение «менее 140» больше не считается достаточным результатом.",by:"из текста рекомендаций"}]},primary:["therapist"],limitations:"Целевые значения получены преимущественно в исследованиях с отобранной популяцией: пациенты с ортостатической гипотензией, тяжёлой ХБП и старше 80 лет представлены ограниченно.",primarySources:[{label:"Полный текст рекомендаций",url:"https://scardio.ru"},{label:"Таблицы уровней доказательности",url:"https://scardio.ru"}]},{id:"a-ther-2",feed:"A",type:"meta_analysis",title:"ПОАК против варфарина у пациентов 75+ с фибрилляцией предсердий",source:{name:"Cochrane Library",kind:"journal"},url:"https://www.cochranelibrary.com",date:"2026-07-24",readMin:9,evidence:"1A",evidenceNote:"Метаанализ 32 РКИ, n = 48 210, медиана наблюдения 2,4 года",summary:"Прямые оральные антикоагулянты снижают риск ишемического инсульта у пациентов старше 75 лет при сопоставимой частоте больших кровотечений. Уверенность в оценке повышена с умеренной до высокой.",why:"Снимает основной аргумент против ПОАК у пожилых — недостаток данных по подгруппе 80+ и ХБП С3.",media:null,detail:{lead:"Обновлённый обзор включил шесть новых исследований с пациентами старше 80 лет и с умеренным снижением функции почек — подгруппой, по которой раньше данных не хватало.",blocks:[{t:"p",v:"Первичная конечная точка — ишемический инсульт и системная эмболия. Вторичные — большие кровотечения по критериям ISTH, внутричерепные кровоизлияния и смерть от любых причин. Гетерогенность между исследованиями низкая, направление эффекта сохраняется в анализе чувствительности с исключением работ высокого риска систематической ошибки."},{t:"table",head:["Исход","ПОАК","Варфарин"],rows:[["Ишемический инсульт","2,1 %/год","3,0 %/год"],["Большие кровотечения","3,4 %/год","3,6 %/год"],["Внутричерепные кровоизлияния","0,4 %/год","0,9 %/год"]]},{t:"h",v:"Что это меняет в практике"},{t:"p",v:"Возраст сам по себе перестаёт быть доводом в пользу варфарина. Практическое ограничение остаётся прежним: доза подбирается по клиренсу креатинина, массе тела и возрасту, а при полипрагмазии обязательна сверка взаимодействий."}]},primary:["therapist"],limitations:"Часть включённых исследований выполнена до широкого применения редуцированных доз; данные по пациентам с массой тела менее 50 кг ограничены.",primarySources:[{label:"Систематический обзор и метаанализ",url:"https://www.cochranelibrary.com"},{label:"Приложения: воронкообразные графики и анализ чувствительности",url:"https://www.cochranelibrary.com"}]},{id:"a-ther-3",feed:"A",type:"research",title:"Старт статинов в первые 72 часа после ишемического инсульта",source:{name:"BMJ",kind:"journal"},url:"https://www.bmj.com",date:"2026-07-18",readMin:6,evidence:"2B",evidenceNote:"Наблюдательная когорта, n = 21 470, наблюдение 12 месяцев",summary:"Раннее назначение связано с меньшей частотой повторных сосудистых событий на горизонте года: 8,4 % против 10,5 % при отсроченном старте. Дизайн наблюдательный.",why:"Поддерживает решение не откладывать гиполипидемическую терапию до выписки, но не заменяет РКИ.",media:{kind:"cover",src:"./media/clinic.jpg",alt:"Рабочее место врача: разбор данных пациента",credit:"Фото: Unsplash"},detail:{lead:"Работа оценивает не сам факт назначения статинов, а точку старта: первые 72 часа против назначения на выписке.",blocks:[{t:"p",v:"Абсолютная разница составила 2,1 процентного пункта. Группы сопоставлялись методом propensity score, однако остаточное смешивание вероятно: пациенты с ранним стартом в среднем имели меньшую тяжесть инсульта по NIHSS."},{t:"h",v:"Как читать результат"},{t:"ul",v:["Уровень доказательности 2B — ассоциация, а не доказанная причинность","Эффект однороден в подгруппах по возрасту и полу","Данных по геморрагической трансформации в работе нет"]},{t:"p",v:"Разумный вывод для практики: при отсутствии противопоказаний и стабильной функции печени откладывать старт до выписки нет оснований. Решение остаётся индивидуальным."}]},primary:["therapist"],limitations:"Дизайн наблюдательный: группа раннего старта имела меньшую исходную тяжесть инсульта, остаточное смешивание не исключено.",primarySources:[{label:"Публикация с полным текстом",url:"https://www.bmj.com"},{label:"Дизайн и протокол исследования",url:"https://www.bmj.com"}]},{id:"a-endo-1",feed:"A",type:"guideline_update",title:"Алгоритмы ведения сахарного диабета 2 типа: обновление разделов по кардио- и нефропротекции",source:{name:"Российская ассоциация эндокринологов",kind:"association"},url:"https://rae-org.ru",date:"2026-07-27",readMin:8,evidence:"1A",evidenceNote:"Консенсус на основе 26 РКИ и трёх метаанализов",summary:"SGLT2-ингибиторы и агонисты ГПП-1 переведены в первую линию у пациентов с установленным ССЗ или ХБП независимо от уровня HbA1c и приёма метформина.",why:"Меняет логику назначения: выбор препарата определяется профилем осложнений, а не только гликемическим контролем.",media:null,detail:{lead:"Обновление смещает акцент с достижения целевого HbA1c на профилактику органных осложнений. Препарат теперь выбирается от сопутствующей патологии.",blocks:[{t:"p",v:"У пациентов с атеросклеротическим ССЗ, сердечной недостаточностью или ХБП препараты с доказанной органопротекцией назначаются сразу, вне зависимости от того, достигнут ли целевой HbA1c на метформине."},{t:"h",v:"Ключевые пороги"},{t:"ul",v:["СКФ ≥ 20 мл/мин/1,73 м² — старт SGLT2-ингибитора допустим","Альбуминурия А2–А3 — приоритет нефропротекции над титрацией по HbA1c","ХСН любой ФВ — SGLT2-ингибитор рассматривается первым"]},{t:"h",v:"Что это меняет в практике"},{t:"p",v:"Пересмотрите терапию у пациентов, стабильно компенсированных на метформине с сульфонилмочевиной: при наличии ССЗ или ХБП такая схема больше не считается оптимальной. Отдельно оговорена деинтенсификация у пожилых с риском гипогликемий."}]},primary:["endocrinologist"],limitations:"Рекомендация опирается на исследования с сердечно-сосудистыми конечными точками; данные по пациентам без ССЗ и ХБП экстраполированы.",primarySources:[{label:"Полный текст рекомендаций",url:"https://rae-org.ru"},{label:"Таблицы уровней доказательности",url:"https://rae-org.ru"}]},{id:"a-endo-2",feed:"A",type:"research",title:"Агонисты ГПП-1 и почечные исходы при СД2: результаты 36 месяцев",source:{name:"New England Journal of Medicine",kind:"journal"},url:"https://www.nejm.org",date:"2026-07-22",readMin:7,evidence:"1B",evidenceNote:"Двойное слепое РКИ, n = 7 120, 36 месяцев",summary:"Снижение композитной почечной конечной точки на 22 % относительно плацебо. Эффект сохраняется у пациентов с исходной альбуминурией и не зависит от снижения массы тела.",why:"Расширяет показания к раннему назначению у пациентов с диабетической нефропатией без выраженной гипергликемии.",media:{kind:"cover",src:"./media/clinic.jpg",alt:"Рабочее место врача амбулаторного приёма",credit:"Фото: Unsplash"},detail:{lead:"Исследование оценивало почечные, а не гликемические исходы: устойчивое снижение СКФ на 50 %, терминальная почечная недостаточность, смерть от почечных причин.",blocks:[{t:"p",v:"Композитная конечная точка достигнута у 8,9 % в группе терапии против 11,3 % в группе плацебо. Медиана снижения альбуминурии — 31 % к 12-му месяцу, эффект удерживался до конца наблюдения."},{t:"h",v:"Переносимость"},{t:"ul",v:["Отмена из-за нежелательных явлений: 7,4 % против 5,1 %","Преобладали гастроинтестинальные реакции в период титрации","Частота панкреатита не различалась между группами"]},{t:"p",v:"Практический вывод: у пациента с альбуминурией польза не сводится к контролю гликемии, поэтому нормальный HbA1c не аргумент против назначения."}]},primary:["endocrinologist"],limitations:"Средний срок наблюдения 36 месяцев не позволяет оценить долгосрочную сохранность функции почек; доля пациентов с СКФ ниже 30 мала.",primarySources:[{label:"Публикация с полным текстом",url:"https://www.nejm.org"},{label:"Дизайн и протокол исследования",url:"https://www.nejm.org"}]},{id:"a-endo-3",feed:"A",type:"meta_analysis",title:"Субклинический гипотиреоз: когда терапия левотироксином даёт клинический эффект",source:{name:"JAMA",kind:"journal"},url:"https://jamanetwork.com",date:"2026-07-15",readMin:8,evidence:"1A",evidenceNote:"Метаанализ 24 РКИ, n = 12 400",summary:"У пациентов старше 65 лет с ТТГ 4,5–10 мЕд/л терапия не улучшает симптомы, качество жизни и сердечно-сосудистые исходы. Польза сохраняется при ТТГ выше 10 мЕд/л и у молодых с антителами к ТПО.",why:"Аргумент против рутинного назначения левотироксина по единичному повышению ТТГ у пожилых.",media:null,detail:{lead:"Обзор разводит две ситуации, которые в практике часто смешивают: изолированное повышение ТТГ у пожилого пациента и субклинический гипотиреоз с антителами у молодого.",blocks:[{t:"p",v:"В группе 65+ с ТТГ 4,5–10 мЕд/л различий по шкалам усталости и качества жизни не получено ни в одном включённом исследовании достаточной мощности. Возрастное смещение референсного интервала ТТГ вверх авторы считают физиологичным."},{t:"h",v:"Когда терапия оправдана"},{t:"ul",v:["ТТГ стойко выше 10 мЕд/л при повторном измерении через 2–3 месяца","Возраст до 65 лет в сочетании с антителами к ТПО и симптомами","Планирование беременности и период гестации"]},{t:"p",v:"Практика: перед назначением повторить ТТГ с интервалом 2–3 месяца и оценить свободный Т4 — часть повышений транзиторны."}]},primary:["endocrinologist"],secondary:["therapist"],limitations:"В большинстве включённых исследований не оценивались когнитивные исходы; пациенты с ТТГ выше 10 мЕд/л рассматривались отдельно и малочисленны.",primarySources:[{label:"Систематический обзор и метаанализ",url:"https://jamanetwork.com"},{label:"Приложения: воронкообразные графики и анализ чувствительности",url:"https://jamanetwork.com"}]},{id:"a-dent-1",feed:"A",type:"meta_analysis",title:"Лечение перимплантита: хирургический доступ против нехирургического",source:{name:"Journal of Clinical Periodontology",kind:"journal"},url:"https://onlinelibrary.wiley.com",date:"2026-07-26",readMin:7,evidence:"1B",evidenceNote:"Метаанализ 19 исследований, 1 340 имплантатов, наблюдение 12–36 месяцев",summary:"Хирургическая деконтаминация даёт большее снижение глубины зондирования (−1,8 мм против −0,7 мм), но различий по выживаемости имплантата за три года не получено.",why:"Помогает обосновать выбор тактики и объяснить пациенту, чего ждать от нехирургического этапа.",media:{kind:"cover",src:"./media/microscope.jpg",alt:"Исследование образцов в лаборатории",credit:"Фото: Unsplash"},detail:{lead:"Метаанализ сравнивает два подхода к лечению перимплантита и отдельно оценивает вклад адъювантных методов.",blocks:[{t:"p",v:"Нехирургическая деконтаминация обеспечивает контроль воспаления при глубине карманов до 5 мм, но при более выраженной убыли кости эффект нестойкий: рецидив в течение года зарегистрирован у 42 % имплантатов."},{t:"h",v:"Адъювантные методы"},{t:"ul",v:["Лазер и фотодинамическая терапия: значимого преимущества не показано","Системные антибиотики: краткосрочный эффект без влияния на трёхлетние исходы","Регенеративные методики: результат зависит от конфигурации дефекта"]},{t:"p",v:"Что делать на приёме: при кармане свыше 6 мм и убыли кости более трети длины имплантата планировать хирургический этап сразу, не растягивая консервативные попытки."}]},primary:["dentist"],limitations:"Разнородность протоколов деконтаминации между исследованиями высокая; срок наблюдения в половине работ не превышает 12 месяцев.",primarySources:[{label:"Систематический обзор и метаанализ",url:"https://onlinelibrary.wiley.com"},{label:"Приложения: воронкообразные графики и анализ чувствительности",url:"https://onlinelibrary.wiley.com"}]},{id:"a-dent-2",feed:"A",type:"research",title:"Фторид диамина серебра при кариесе временных зубов: 24-месячные результаты",source:{name:"Journal of Dental Research",kind:"journal"},url:"https://journals.sagepub.com",date:"2026-07-19",readMin:5,evidence:"1B",evidenceNote:"Рандомизированное исследование, 812 детей, 24 месяца",summary:"Остановка кариозного процесса достигнута в 76 % очагов против 41 % при использовании только фторлака. Основное ограничение — стойкое тёмное окрашивание очага.",why:"Даёт неинвазивную опцию для детей, которым сложно провести полноценное препарирование.",media:null,detail:{lead:"Исследование оценивало применение SDF в условиях реальной практики, включая детей раннего возраста с поведенческими сложностями.",blocks:[{t:"p",v:"Повторная аппликация проводилась каждые шесть месяцев. Наибольшая эффективность получена на доступных гладких поверхностях; на апроксимальных очагах разница с контролем сокращалась."},{t:"h",v:"О чём предупредить родителей"},{t:"ul",v:["Окрашивание обработанного дентина в чёрный цвет — ожидаемый результат, а не осложнение","Метод не отменяет последующего восстановления зуба","Требуется повторная аппликация дважды в год"]},{t:"p",v:"Практический вывод: SDF уместен как метод стабилизации, когда альтернатива — лечение под наркозом или отложенная санация."}]},primary:["dentist"],limitations:"Исследование проводилось в популяции с высокой распространённостью кариеса; результаты на апроксимальных поверхностях менее устойчивы.",primarySources:[{label:"Публикация с полным текстом",url:"https://journals.sagepub.com"},{label:"Дизайн и протокол исследования",url:"https://journals.sagepub.com"}]},{id:"a-dent-3",feed:"A",type:"case_review",title:"Клинический разбор: одонтогенный верхнечелюстной синусит после эндодонтического лечения",source:{name:"Стоматологическая ассоциация России",kind:"association"},url:"https://e-stomatology.ru",date:"2026-07-12",readMin:6,evidence:"3",evidenceNote:"Описание серии из 14 случаев",summary:"Разбор диагностического маршрута: когда КЛКТ обязательна, как отличить одонтогенный синусит от риногенного и в какой момент подключать оториноларинголога.",why:"Частая причина затяжного «непонятного» синусита, который лечат без стоматологического этапа.",media:null,detail:{lead:"У всех пациентов серии первично исключался риногенный характер синусита, лечение антибиотиками длилось от трёх недель до полугода без стойкого эффекта.",blocks:[{t:"p",v:"Ключевой признак — односторонний процесс с неприятным запахом отделяемого и связь с ранее леченным зубом верхней челюсти. Панорамный снимок недостаточен: в семи случаях из четырнадцати периапикальные изменения были видны только на КЛКТ."},{t:"h",v:"Порядок действий"},{t:"ul",v:["Односторонний синусит длительностью более трёх недель — оценить зубы верхней челюсти","КЛКТ вместо ортопантомограммы при подозрении на одонтогенную причину","Санация причинного зуба до или одновременно с лечением синусита"]},{t:"p",v:"В двенадцати случаях симптоматика разрешилась после устранения одонтогенного очага без дополнительных курсов антибиотиков."}]},primary:["dentist"],limitations:"Серия случаев без контрольной группы: оценка эффективности санации основана на клиническом наблюдении, а не на сравнении.",primarySources:[{label:"Разбор случаев",url:"https://e-stomatology.ru"},{label:"Клинические изображения и данные обследований",url:"https://e-stomatology.ru"}]},{id:"a-dent-4",feed:"A",type:"guideline_update",title:"Местная анестезия в стоматологии: обновлённые ограничения по дозам адреналина",source:{name:"Стоматологическая ассоциация России",kind:"association"},url:"https://e-stomatology.ru",date:"2026-07-08",readMin:5,evidence:"2A",evidenceNote:"Пересмотр протокола на основе данных фармаконадзора",summary:"Уточнены максимальные дозы вазоконстриктора у пациентов с неконтролируемой АГ, нестабильной стенокардией и на терапии неселективными бета-блокаторами.",why:"Прямо влияет на выбор карпул и планирование объёма вмешательства за один визит.",media:null,detail:{lead:"Обновление касается не запрета вазоконстрикторов, а расчёта суммарной дозы и отбора пациентов с сердечно-сосудистым риском.",blocks:[{t:"p",v:"Для пациентов группы риска максимум ограничен двумя карпулами с концентрацией адреналина 1:100 000 за визит. При неконтролируемой АГ плановое вмешательство откладывается до стабилизации давления."},{t:"ul",v:["Неселективные бета-блокаторы — риск гипертензивной реакции, приоритет анестетику без вазоконстриктора","Тиреотоксикоз в стадии декомпенсации — вазоконстриктор исключён","Измерение АД до вмешательства у пациентов группы риска обязательно"]},{t:"p",v:"Практический эффект: объёмные вмешательства у таких пациентов планируются в несколько визитов."}]},primary:["dentist"],limitations:"Пересмотр основан на данных фармаконадзора, а не на рандомизированных исследованиях; частота осложнений может быть недооценена.",primarySources:[{label:"Полный текст рекомендаций",url:"https://e-stomatology.ru"},{label:"Таблицы уровней доказательности",url:"https://e-stomatology.ru"}]},{id:"a-obgyn-1",feed:"A",type:"guideline_update",title:"Профилактика преэклампсии: аспирин с 12-й недели при двух и более факторах риска",source:{name:"Российское общество акушеров-гинекологов",kind:"association"},url:"https://roag-portal.ru",date:"2026-07-28",readMin:7,evidence:"1A",evidenceNote:"Обзор 14 РКИ, n = 31 800",summary:"Порог назначения ацетилсалициловой кислоты снижен: два умеренных фактора риска вместо одного высокого. Доза 150 мг на ночь с 12-й по 36-ю неделю.",why:"Расширяет группу профилактики и уточняет время приёма — вечерний приём эффективнее утреннего.",media:null,detail:{lead:"Изменения касаются трёх параметров: порога отбора, дозы и времени приёма.",blocks:[{t:"p",v:"К умеренным факторам риска отнесены первая беременность, возраст 35+, ИМТ 30 и выше, интервал между беременностями более 10 лет, преэклампсия в семейном анамнезе. Двух таких факторов достаточно для назначения профилактики."},{t:"table",head:["Параметр","Было","Стало"],rows:[["Порог назначения","1 высокий фактор","1 высокий или 2 умеренных"],["Доза","75–150 мг","150 мг"],["Время приёма","не регламентировано","вечером"]]},{t:"h",v:"Что это меняет в практике"},{t:"p",v:"На первом визите нужен формальный подсчёт факторов риска. Приём до 16-й недели даёт наибольший эффект, после 20-й недели профилактическая ценность существенно снижается."}]},primary:["obgyn"],limitations:"Эффект профилактики оценивался преимущественно при старте до 16 недель; данные по позднему началу ограничены.",primarySources:[{label:"Полный текст рекомендаций",url:"https://roag-portal.ru"},{label:"Таблицы уровней доказательности",url:"https://roag-portal.ru"}]},{id:"a-obgyn-2",feed:"A",type:"meta_analysis",title:"Вагинальный прогестерон при короткой шейке матки: обновлённый метаанализ",source:{name:"The Lancet",kind:"journal"},url:"https://www.thelancet.com",date:"2026-07-21",readMin:8,evidence:"1A",evidenceNote:"Метаанализ индивидуальных данных, 9 РКИ, n = 4 100",summary:"Снижение частоты родов до 34 недель на 38 % у женщин с длиной шейки 25 мм и менее при одноплодной беременности. При многоплодной беременности эффект не подтверждён.",why:"Уточняет, кому профилактика показана, и снимает вопрос о назначении при двойне.",media:null,detail:{lead:"Анализ индивидуальных данных позволил разделить эффект по подгруппам, что не удавалось в обзорах агрегированных результатов.",blocks:[{t:"p",v:"Максимальная польза получена при длине шейки 10–20 мм. При длине 20–25 мм эффект сохраняется, но доверительный интервал шире. Влияния на перинатальную смертность при многоплодии не выявлено."},{t:"ul",v:["Одноплодная беременность, шейка ≤ 25 мм — назначение обосновано","Двойня — рутинное назначение не поддержано данными","Старт с момента выявления укорочения, продолжение до 36 недель"]},{t:"p",v:"Практический вывод: цервикометрия во втором триместре становится точкой принятия решения, а не формальным измерением."}]},primary:["obgyn"],limitations:"Для многоплодной беременности мощность анализа недостаточна; данные о влиянии на отдалённое развитие детей не получены.",primarySources:[{label:"Систематический обзор и метаанализ",url:"https://www.thelancet.com"},{label:"Приложения: воронкообразные графики и анализ чувствительности",url:"https://www.thelancet.com"}]},{id:"a-obgyn-3",feed:"A",type:"case_review",title:"Клинический разбор: послеродовое кровотечение и порядок применения утеротоников",source:{name:"НМИЦ АГП им. Кулакова",kind:"clinic"},url:"https://ncagp.ru",date:"2026-07-14",readMin:6,evidence:"3",evidenceNote:"Разбор 9 случаев с анализом временных интервалов",summary:"Разбор показывает, где теряется время: между оценкой кровопотери и вторым утеротоником в среднем проходило 14 минут при рекомендованных пяти.",why:"Даёт конкретный тайминг действий, который можно перенести в чек-лист родильного блока.",media:{kind:"video",src:"./media/surgery.jpg",alt:"Запись клинического разбора",credit:"Фото: Unsplash",duration:"22:14"},detail:{lead:"Во всех девяти случаях протокол был известен персоналу, но временные интервалы между этапами превышали рекомендованные.",blocks:[{t:"p",v:"Гравиметрическая оценка кровопотери проводилась в семи случаях из девяти, визуальная оценка занижала объём в среднем на 300 мл. Транексамовая кислота вводилась в пределах трёх часов во всех случаях, но медиана составила 47 минут от начала кровотечения."},{t:"h",v:"Чек-лист по времени"},{t:"ul",v:["0 мин — окситоцин, массаж матки, гравиметрический учёт","5 мин — второй утеротоник при продолжающемся кровотечении","15 мин — транексамовая кислота, вызов ответственного дежурного, готовность к баллонной тампонаде"]},{t:"p",v:"Организационный вывод: таймер вслух и один назначенный человек, который его ведёт, сокращают интервалы сильнее, чем повторное обучение протоколу."}]},primary:["obgyn"],video:{transcript:"Разбор построен по хронометражу: команда проходит все этапы протокола, ведущий останавливает запись на моментах, где теряется время.",timecodes:[{at:"00:00",label:"Вводная: что показывает разбор девяти случаев"},{at:"04:12",label:"Гравиметрическая оценка кровопотери"},{at:"11:30",label:"Второй утеротоник: почему опаздывают"},{at:"18:05",label:"Роль таймера и распределение ролей"}]},limitations:"Разбор построен на девяти случаях одного центра; временные интервалы могут отличаться в стационарах другого уровня.",primarySources:[{label:"Разбор случаев",url:"https://ncagp.ru"},{label:"Клинические изображения и данные обследований",url:"https://ncagp.ru"}]},{id:"a-onco-1",feed:"A",type:"guideline_update",title:"Адъювантная терапия раннего HER2-положительного рака молочной железы: деэскалация у низкого риска",source:{name:"RUSSCO",kind:"association"},url:"https://russco.org",date:"2026-07-30",readMin:8,evidence:"1B",evidenceNote:"Пересмотр на основе трёх РКИ, n = 5 900",summary:"Для опухолей pT1a–b pN0 закреплён режим с сокращённой продолжительностью анти-HER2-терапии без потери эффективности по выживаемости без признаков болезни.",why:"Позволяет снизить кардиотоксичность и число визитов у пациентов низкого риска.",media:null,detail:{lead:"Пересмотр формализует практику, которая уже применялась в части центров: сокращённая продолжительность терапии для опухолей минимального размера без поражения лимфоузлов.",blocks:[{t:"p",v:"Трёхлетняя выживаемость без признаков болезни в группе деэскалации составила 96,8 % против 97,1 % в стандартной группе — различия в пределах границы non-inferiority."},{t:"h",v:"Кому не подходит"},{t:"ul",v:["pN+ любой степени","Опухоли pT2 и более","Гормон-негативный статус в сочетании с высоким Ki-67"]},{t:"p",v:"Практика: эхокардиография сохраняется в прежнем графике — сокращение длительности не отменяет мониторинг фракции выброса."}]},primary:["oncologist"],limitations:"Границы non-inferiority заданы для трёхлетнего горизонта; отдалённые исходы деэскалации пока не оценены.",primarySources:[{label:"Полный текст рекомендаций",url:"https://russco.org"},{label:"Таблицы уровней доказательности",url:"https://russco.org"}]},{id:"a-onco-2",feed:"A",type:"research",title:"ctDNA-мониторинг минимальной остаточной болезни при колоректальном раке",source:{name:"Annals of Oncology",kind:"journal"},url:"https://www.annalsofoncology.org",date:"2026-07-23",readMin:9,evidence:"2A",evidenceNote:"Проспективная когорта, n = 1 040, наблюдение 30 месяцев",summary:"Положительный результат ctDNA через четыре недели после операции опережал рентгенологический рецидив в среднем на 7,4 месяца. Чувствительность метода 74 %, специфичность 98 %.",why:"Ставит вопрос о показаниях к адъювантной терапии у ctDNA-положительных пациентов II стадии.",media:{kind:"cover",src:"./media/lab.jpg",alt:"Лабораторный корпус: подготовка образцов для молекулярного анализа",credit:"Фото: Unsplash"},detail:{lead:"Исследование оценивало прогностическую ценность ctDNA как маркёра минимальной остаточной болезни после радикальной операции.",blocks:[{t:"p",v:"Среди ctDNA-положительных пациентов рецидив развился у 82 %, среди отрицательных — у 12 %. Отрицательная предсказательная ценность выше положительной, что важно при обсуждении отказа от адъювантной терапии."},{t:"h",v:"Ограничения"},{t:"ul",v:["Влияние ctDNA-навигации на общую выживаемость пока не доказано","Чувствительность ниже при опухолях без выявленных драйверных мутаций","Стоимость и доступность метода ограничивают рутинное применение"]},{t:"p",v:"Практический статус: метод обоснован в рамках исследований и мультидисциплинарных решений, но не как самостоятельное показание к терапии."}]},primary:["oncologist"],limitations:"Влияние ctDNA-навигации на общую выживаемость не доказано; чувствительность снижается у опухолей без выявленных драйверных мутаций.",primarySources:[{label:"Публикация с полным текстом",url:"https://www.annalsofoncology.org"},{label:"Дизайн и протокол исследования",url:"https://www.annalsofoncology.org"}]},{id:"a-onco-3",feed:"A",type:"safety_alert",title:"Иммуноопосредованный миокардит: обновлённый алгоритм при терапии ингибиторами контрольных точек",source:{name:"Росздравнадзор",kind:"official"},url:"https://roszdravnadzor.gov.ru",date:"2026-07-25",readMin:5,evidence:"2B",evidenceNote:"Информационное письмо, анализ 64 сообщений о нежелательных реакциях",summary:"Медиана развития — 34 дня от первой инфузии, летальность в серии 21 %. Рекомендован контроль тропонина перед первыми четырьмя циклами.",why:"Редкое, но быстро фатальное осложнение с неспецифическим дебютом — одышка и утомляемость.",media:null,detail:{lead:"Письмо уточняет порядок мониторинга и действий при подозрении на иммуноопосредованный миокардит.",blocks:[{t:"p",v:"Дебют неспецифичен: утомляемость, одышка при нагрузке, реже — нарушения ритма. Изолированное повышение тропонина без клиники требует немедленной паузы в терапии и кардиологической консультации."},{t:"h",v:"Алгоритм"},{t:"ul",v:["Тропонин и ЭКГ перед каждым из первых четырёх циклов","Рост тропонина — приостановка терапии до исключения миокардита","Подтверждённый миокардит — высокие дозы глюкокортикоидов, отмена ингибитора контрольных точек"]},{t:"p",v:"Возобновление терапии после подтверждённого миокардита не рекомендовано."}]},primary:["oncologist"],limitations:"Оценка основана на спонтанных сообщениях: истинная частота осложнения неизвестна, возможна систематическая недорегистрация.",primarySources:[{label:"Информационное письмо",url:"https://roszdravnadzor.gov.ru"},{label:"Государственный реестр лекарственных средств",url:"https://roszdravnadzor.gov.ru"}]},{id:"a-derm-1",feed:"A",type:"guideline_update",title:"Атопический дерматит: пересмотр линий системной терапии среднетяжёлых форм",source:{name:"РОДВК",kind:"association"},url:"https://rodv.ru",date:"2026-07-29",readMin:7,evidence:"1A",evidenceNote:"Обзор 21 РКИ, n = 9 800",summary:"Таргетная биологическая терапия перенесена во вторую линию сразу после неэффективности топических ингибиторов кальциневрина, без обязательного этапа системных иммуносупрессантов.",why:"Сокращает путь пациента до эффективной терапии и снижает экспозицию циклоспорина.",media:null,detail:{lead:"Основное изменение — отказ от обязательного промежуточного этапа классической иммуносупрессии перед назначением таргетной терапии.",blocks:[{t:"p",v:"Ранее переход к биологической терапии требовал документированной неэффективности или непереносимости циклоспорина. Теперь при среднетяжёлом течении и неэффективности топической терапии этот этап можно пропустить."},{t:"h",v:"Оценка тяжести"},{t:"ul",v:["EASI и DLQI фиксируются до старта и через 16 недель","Отсутствие ответа EASI-50 к 16-й неделе — основание для смены препарата","Топическая терапия сохраняется как базовая на всех линиях"]},{t:"p",v:"Практика: документируйте индексы в карте — без них обоснование смены линии терапии не проходит экспертизу."}]},primary:["dermatovenerologist"],limitations:"Сравнение линий терапии выполнено преимущественно в исследованиях с исключением пациентов с сопутствующими инфекциями.",primarySources:[{label:"Полный текст рекомендаций",url:"https://rodv.ru"},{label:"Таблицы уровней доказательности",url:"https://rodv.ru"}]},{id:"a-derm-2",feed:"A",type:"research",title:"Алгоритмическая оценка дерматоскопических изображений в первичном звене",source:{name:"JAMA Dermatology",kind:"journal"},url:"https://jamanetwork.com",date:"2026-07-20",readMin:6,evidence:"2A",evidenceNote:"Проспективное сравнительное исследование, 4 320 образований",summary:"Чувствительность алгоритма для меланомы 91 % против 84 % у врача первичного звена, специфичность ниже: 76 % против 89 %. Число необоснованных направлений выросло на треть.",why:"Показывает цену повышенной чувствительности — рост нагрузки на дерматологов и биопсий.",media:{kind:"cover",src:"./media/microscope.jpg",alt:"Оценка образцов в лаборатории",credit:"Фото: Unsplash"},detail:{lead:"Исследование сравнивало решения алгоритма и врача первичного звена с гистологическим заключением как эталоном.",blocks:[{t:"p",v:"Комбинация «врач плюс алгоритм» показала лучший баланс: чувствительность 93 % при специфичности 85 %. Алгоритм в автономном режиме систематически переоценивал доброкачественные себорейные кератозы."},{t:"ul",v:["Прирост чувствительности — за счёт тонких меланом до 0,8 мм","Рост направлений к дерматологу на 31 %","Наибольшая ошибка — пигментированные образования на коже с выраженным фотоповреждением"]},{t:"p",v:"Вывод: алгоритм уместен как инструмент второго мнения, а не как фильтр направлений."}]},primary:["dermatovenerologist"],limitations:"Алгоритм обучен на выборке с преобладанием светлых фототипов кожи; на IV–VI фототипах точность ниже.",primarySources:[{label:"Публикация с полным текстом",url:"https://jamanetwork.com"},{label:"Дизайн и протокол исследования",url:"https://jamanetwork.com"}]},{id:"a-derm-3",feed:"A",type:"evidence_review",title:"Рост заболеваемости сифилисом: что меняется в тактике скрининга",source:{name:"Минздрав России",kind:"official"},url:"https://minzdrav.gov.ru",date:"2026-07-16",readMin:6,evidence:"2A",evidenceNote:"Аналитический обзор данных эпиднадзора за 2023–2026 годы",summary:"Заболеваемость выросла в большинстве регионов, доля скрытых форм превысила половину случаев. Расширены показания к повторному тестированию в третьем триместре беременности.",why:"Меняет схему скрининга беременных и требует настороженности при атипичных высыпаниях.",media:null,detail:{lead:"Обзор фиксирует смещение структуры заболеваемости в сторону скрытых форм, которые выявляются только серологически.",blocks:[{t:"p",v:"Доля скрытого сифилиса превысила 50 % впервые выявленных случаев. Клинический дебют всё чаще стёртый, что удлиняет срок до постановки диагноза."},{t:"h",v:"Что изменилось в скрининге"},{t:"ul",v:["Беременные: тестирование при постановке на учёт, в 28–30 недель и при поступлении на роды","Повторное тестирование при любом ИППП в анамнезе за последние 12 месяцев","Расширены показания к обследованию половых партнёров"]},{t:"p",v:"Практический вывод: при неясной сыпи, особенно ладонно-подошвенной локализации, серологическое обследование выполняется без ожидания консультации специалиста."}]},primary:["dermatovenerologist"],secondary:["obgyn"],limitations:"Данные эпиднадзора зависят от полноты регистрации в регионах; часть роста может объясняться улучшением выявления.",primarySources:[{label:"Аналитический обзор",url:"https://minzdrav.gov.ru"},{label:"Источники данных и методика",url:"https://minzdrav.gov.ru"}]},{id:"a-derm-4",feed:"A",type:"meta_analysis",title:"Биологическая терапия псориаза: сравнение классов по достижению PASI 90",source:{name:"British Journal of Dermatology",kind:"journal"},url:"https://academic.oup.com/bjd",date:"2026-07-11",readMin:8,evidence:"1A",evidenceNote:"Сетевой метаанализ 42 РКИ, n = 22 600",summary:"Ингибиторы IL-23 и IL-17 превосходят ингибиторы ФНО-α по достижению PASI 90 к 16-й неделе. Различия внутри классов клинически несущественны.",why:"Помогает выбирать класс препарата с учётом сопутствующей патологии, а не только по эффективности.",media:null,detail:{lead:"Сетевой метаанализ позволяет сравнить препараты, которые не сравнивались напрямую в РКИ.",blocks:[{t:"table",head:["Класс","PASI 90 к 16-й неделе"],rows:[["Ингибиторы IL-23","72–78 %"],["Ингибиторы IL-17","70–79 %"],["Ингибиторы ФНО-α","44–58 %"]]},{t:"h",v:"Как выбирать"},{t:"ul",v:["Сопутствующий псориатический артрит — приоритет IL-17 или ФНО-α","Воспалительные заболевания кишечника — IL-17 нежелательны","Кандидоз в анамнезе — учитывать при выборе IL-17"]},{t:"p",v:"Вывод: разница между классами значима, внутри класса выбор определяется доступностью и режимом введения."}]},primary:["dermatovenerologist"],limitations:"Сетевой метаанализ строится на косвенных сравнениях: прямые сравнительные исследования между классами немногочисленны.",primarySources:[{label:"Систематический обзор и метаанализ",url:"https://academic.oup.com/bjd"},{label:"Приложения: воронкообразные графики и анализ чувствительности",url:"https://academic.oup.com/bjd"}]},{id:"a-x-1",feed:"A",type:"safety_alert",title:"Остеонекроз челюсти при антирезорбтивной терапии: обновлённые правила подготовки к вмешательствам",source:{name:"Росздравнадзор",kind:"official"},url:"https://roszdravnadzor.gov.ru",date:"2026-07-27",readMin:5,evidence:"2A",evidenceNote:"Информационное письмо, 187 сообщений за 24 месяца",summary:"Санация полости рта до старта терапии бисфосфонатами и деносумабом становится обязательным этапом. Уточнены сроки плановых удалений на фоне лечения.",why:"Требует согласования между онкологом, эндокринологом и стоматологом до первой инъекции.",media:null,detail:{lead:"Письмо закрепляет междисциплинарный порядок: стоматологический этап планируется до начала антирезорбтивной терапии, а не после осложнения.",blocks:[{t:"p",v:"Большинство зарегистрированных случаев связано с удалением зуба на фоне продолжающейся терапии. Медиана до манифестации — 14 месяцев от начала лечения."},{t:"h",v:"Порядок подготовки"},{t:"ul",v:["Санация и заживление лунок до первой инъекции: минимум 3 недели","Плановые удаления на фоне терапии — по согласованию с назначившим врачом","Обязательный инструктаж пациента о симптомах: боль, обнажение кости, свищ"]},{t:"p",v:"Для онкологических доз риск выше, чем для остеопоротических, но правило подготовки едино."}]},general:!0,primary:[],secondary:["dentist","oncologist","endocrinologist"],limitations:"Оценка риска основана на спонтанных сообщениях без знаменателя: сравнить частоту между препаратами по этим данным нельзя.",primarySources:[{label:"Информационное письмо",url:"https://roszdravnadzor.gov.ru"},{label:"Государственный реестр лекарственных средств",url:"https://roszdravnadzor.gov.ru"}]},{id:"a-x-2",feed:"A",type:"safety_alert",title:"Препараты с тератогенным потенциалом у женщин детородного возраста: ужесточение условий назначения",source:{name:"Минздрав России",kind:"official"},url:"https://minzdrav.gov.ru",date:"2026-07-24",readMin:6,evidence:"2A",evidenceNote:"Изменения в инструкциях, данные регистра беременностей",summary:"Для вальпроатов, изотретиноина и микофенолата закреплена программа предотвращения беременности: тест перед стартом, контрацепция и повторное тестирование ежемесячно.",why:"Назначение без документированной программы становится дефектом ведения, а не формальностью.",media:null,detail:{lead:"Изменения касаются документирования: устного предупреждения о риске теперь недостаточно.",blocks:[{t:"p",v:"Для каждого препарата предусмотрена форма информированного согласия, отрицательный тест на беременность перед стартом и подтверждённая контрацепция на весь период терапии и оговорённый срок после отмены."},{t:"ul",v:["Вальпроаты: при эпилепсии — только при неэффективности альтернатив","Изотретиноин: тест ежемесячно, контрацепция за месяц до и месяц после курса","Микофенолат: контрацепция в течение 6 недель после отмены"]},{t:"p",v:"Практика: заведите в карте чек-лист — он же защищает врача при разборе случая."}]},general:!0,primary:[],secondary:["obgyn","therapist","dermatovenerologist"],limitations:"Требования формализуют документирование, но не отменяют клиническую оценку соотношения пользы и риска в конкретном случае.",primarySources:[{label:"Информационное письмо",url:"https://minzdrav.gov.ru"},{label:"Государственный реестр лекарственных средств",url:"https://minzdrav.gov.ru"}]},{id:"a-x-3",feed:"A",type:"evidence_review",title:"Скрининг колоректального рака: снижение возраста начала до 45 лет",source:{name:"НМИЦ онкологии им. Блохина",kind:"clinic"},url:"https://ronc.ru",date:"2026-07-17",readMin:7,evidence:"1B",evidenceNote:"Обзор популяционных данных и моделирование",summary:"Рост заболеваемости в возрастной группе 45–49 лет обосновывает более ранний старт скрининга. Иммунохимический тест кала ежегодно остаётся базовым методом.",why:"Меняет возрастную планку, с которой терапевт предлагает скрининг на плановом приёме.",media:null,detail:{lead:"Обзор обобщает данные о смещении заболеваемости в более молодые возрастные группы и оценивает баланс пользы и вреда раннего скрининга.",blocks:[{t:"p",v:"Заболеваемость в группе 45–49 лет выросла заметнее, чем в старших группах. Моделирование показывает выигрыш в предотвращённых случаях при приемлемом росте числа колоноскопий."},{t:"ul",v:["Базовый метод — иммунохимический тест кала ежегодно","Колоноскопия раз в 10 лет — альтернатива при доступности","Отягощённый семейный анамнез — индивидуальный план и более ранний старт"]},{t:"p",v:"Практика: вопрос о скрининге уместно задавать на любом плановом приёме пациента 45+, а не только на диспансеризации."}]},general:!0,primary:[],secondary:["therapist","oncologist","endocrinologist"],limitations:"Моделирование чувствительно к предпосылкам об охвате скринингом; фактический эффект зависит от организации маршрутизации.",primarySources:[{label:"Аналитический обзор",url:"https://ronc.ru"},{label:"Источники данных и методика",url:"https://ronc.ru"}]},{id:"a-x-4",feed:"A",type:"guideline_update",title:"Рациональная антибиотикотерапия: сокращение показаний к профилактике в амбулаторной практике",source:{name:"Минздрав России",kind:"official"},url:"https://minzdrav.gov.ru",date:"2026-07-13",readMin:6,evidence:"1B",evidenceNote:"Национальный протокол, обзор данных резистентности",summary:"Пересмотрены показания к антибиотикопрофилактике инфекционного эндокардита и к назначению антибиотиков при неосложнённых вмешательствах. Сокращены типовые длительности курсов.",why:"Прямо касается назначений на приёме: часть привычных схем больше не поддерживается протоколом.",media:null,detail:{lead:"Протокол сужает список ситуаций, в которых профилактика обоснована, и фиксирует более короткие курсы терапии.",blocks:[{t:"p",v:"Профилактика инфекционного эндокардита сохранена только для пациентов наивысшего риска: протезированный клапан, перенесённый эндокардит, отдельные врождённые пороки. Для остальных групп рутинная профилактика не рекомендована."},{t:"h",v:"Типовые длительности"},{t:"table",head:["Ситуация","Было","Стало"],rows:[["Неосложнённый цистит","7 дней","3 дня"],["Внебольничная пневмония лёгкого течения","7–10 дней","5 дней"],["Одонтогенная инфекция после санации очага","7 дней","по показаниям, обычно не требуется"]]},{t:"p",v:"Практика: длительность курса фиксируется в назначении вместе с критерием отмены."}]},general:!0,primary:[],secondary:["dentist","therapist","obgyn"],limitations:"Сокращение курсов подтверждено для типовых неосложнённых форм; при осложнённом течении длительность определяется клинически.",primarySources:[{label:"Полный текст рекомендаций",url:"https://minzdrav.gov.ru"},{label:"Таблицы уровней доказательности",url:"https://minzdrav.gov.ru"}]},{id:"a-x-5",feed:"A",type:"research",title:"Добавки витамина D и клинические исходы: результаты пятилетнего наблюдения",source:{name:"The Lancet",kind:"journal"},url:"https://www.thelancet.com",date:"2026-07-10",readMin:7,evidence:"1B",evidenceNote:"РКИ, n = 25 800, наблюдение 5 лет",summary:"Рутинный приём без подтверждённого дефицита не снижает частоту переломов, сердечно-сосудистых событий и онкологических заболеваний. Польза сохраняется при уровне 25(OH)D ниже 30 нмоль/л.",why:"Аргумент против массового назначения «для профилактики» без лабораторного подтверждения.",media:{kind:"cover",src:"./media/lab.jpg",alt:"Лабораторный анализ образцов",credit:"Фото: Unsplash"},detail:{lead:"Исследование проверяло популяционную профилактику, а не лечение подтверждённого дефицита — это принципиальное различие при чтении результата.",blocks:[{t:"p",v:"В общей выборке различий с плацебо по первичным конечным точкам не получено. В подгруппе с исходным уровнем 25(OH)D ниже 30 нмоль/л снижение частоты переломов было значимым."},{t:"ul",v:["Скрининг 25(OH)D всему населению не показан","Группы риска дефицита — обоснование для тестирования и коррекции","Высокие болюсные дозы преимуществ не показали"]},{t:"p",v:"Практика: назначать по результату анализа в группах риска, а не по запросу пациента."}]},general:!0,primary:[],secondary:["therapist","endocrinologist","obgyn"],limitations:"Исследование оценивало популяционную профилактику, а не лечение подтверждённого дефицита — переносить вывод на группы риска некорректно.",primarySources:[{label:"Публикация с полным текстом",url:"https://www.thelancet.com"},{label:"Дизайн и протокол исследования",url:"https://www.thelancet.com"}]},{id:"a-x-6",feed:"A",type:"meta_analysis",title:"Вакцинация против ВПЧ и частота предраковых поражений шейки матки",source:{name:"Cochrane Library",kind:"journal"},url:"https://www.cochranelibrary.com",date:"2026-07-09",readMin:7,evidence:"1A",evidenceNote:"Метаанализ 17 когорт и РКИ, n = 1,2 млн",summary:"Снижение частоты CIN2+ на 68 % у вакцинированных до начала половой жизни. Эффект сохраняется при однодозовой схеме в возрасте 9–14 лет.",why:"Однодозовая схема упрощает организацию вакцинации и разговор с родителями на приёме.",media:null,detail:{lead:"Обзор объединяет данные национальных программ и рандомизированных исследований, включая сравнение схем.",blocks:[{t:"p",v:"Наибольши
