dAt:"2026-07-24",specialty:"cardiologist",evidence:"1A",evidenceNote:"Метаанализ 32 РКИ, n = 48 210, средний срок наблюдения 2,4 года",summary:"Обновлённый Cochrane-обзор подтверждает снижение риска ишемического инсульта на ПОАК по сравнению с варфарином у пациентов старше 75 лет при сопоставимой частоте больших кровотечений.",whatChanged:"В анализ добавлены 6 новых РКИ с пациентами 80+ и с ХБП С3. Ранее данные по этой подгруппе считались недостаточными, теперь оценка уверенности повышена с умеренной до высокой.",practiceImpact:"Дополнительный аргумент в пользу ПОАК у пожилых при отсутствии противопоказаний. Дозу подбирайте по клиренсу креатинина, массе тела и возрасту; сверяйте лекарственные взаимодействия при полипрагмазии.",readingMinutes:10,tags:["ПОАК","фибрилляция предсердий","гериатрия"],fullText:"Первичная конечная точка — ишемический инсульт и системная эмболия. Вторичные — большие кровотечения по критериям ISTH, внутричерепные кровоизлияния, смерть от любых причин. Гетерогенность между исследованиями низкая. Отдельно приводится анализ чувствительности с исключением исследований с высоким риском систематической ошибки — направление эффекта сохраняется."},{id:"a03",type:"drug_safety",title:"Уточнены взаимодействия аторвастатина с ингибиторами CYP3A4",source:"Минздрав России",sourceStatus:"official",sourceUrl:"https://example.org/grls/atorvastatin-2026",publishedAt:"2026-07-26",specialty:"therapist",evidence:"2A",evidenceNote:"Данные фармаконадзора, 412 спонтанных сообщений за 24 месяца",summary:"В инструкцию внесены изменения: расширен раздел лекарственных взаимодействий, добавлено ограничение максимальной дозы при совместном приёме с рядом противогрибковых препаратов и кларитромицином.",whatChanged:"Максимальная доза аторвастатина при сопутствующем приёме итраконазола и кларитромицина ограничена 20 мг/сут. Добавлено предупреждение о риске рабдомиолиза при комбинации с колхицином.",practiceImpact:"Проверьте текущие назначения пациентов, получающих аторвастатин 40–80 мг вместе с азольными противогрибковыми или макролидами. При коротком курсе антибиотика рассмотрите временное снижение дозы статина.",readingMinutes:4,tags:["статины","лекарственные взаимодействия","фармаконадзор"]},{id:"a04",type:"research",title:"SGLT2-ингибиторы при ХСН с сохранённой ФВ: 24-месячные результаты",source:"New England Journal of Medicine",sourceStatus:"peer_reviewed",sourceUrl:"https://example.org/nejm/sglt2-hfpef-2026",publishedAt:"2026-07-21",specialty:"cardiologist",evidence:"1B",evidenceNote:"Многоцентровое двойное слепое РКИ, n = 6 240, 24 месяца",summary:"Снижение частоты госпитализаций по поводу декомпенсации ХСН в группе с сохранённой ФВ сохраняется на горизонте двух лет. Эффект не зависит от исходной СКФ и наличия сахарного диабета.",whatChanged:"Ранее опубликованные 12-месячные данные подтверждены на удвоенном сроке наблюдения. Впервые показана стабильность эффекта в подгруппе с СКФ 30–45 мл/мин/1,73 м².",practiceImpact:"Рассматривайте SGLT2-ингибиторы у пациентов с HFpEF независимо от статуса диабета. Контролируйте волемический статус в первые недели и предупреждайте пациента о риске урогенитальных инфекций.",readingMinutes:8,tags:["ХСН","HFpEF","SGLT2"],fullText:"Включались пациенты старше 45 лет с ФВ ЛЖ ≥ 50% и симптомами ХСН II–III ФК по NYHA. Первичная конечная точка — совокупность сердечно-сосудистой смерти и госпитализаций по поводу ХСН. Прекращение терапии из-за нежелательных явлений — 6,8% против 6,1% в группе плацебо."},{id:"a05",type:"standard_change",title:"Изменён объём обязательных исследований при углублённой диспансеризации",source:"Минздрав России",sourceStatus:"official",sourceUrl:"https://example.org/minzdrav/order-2026-dispanserizaciya",publishedAt:"2026-07-25",specialty:"therapist",evidence:"expert",evidenceNote:"Нормативный акт, вступает в силу с 1 сентября 2026 года",summary:"Приказ уточняет перечень обязательных исследований по кардиологическому профилю при углублённой диспансеризации взрослого населения.",w
